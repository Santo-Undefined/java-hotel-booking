services:
  nginx:
    image: nginx:latest
    container_name: nginxContainer
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
      - backend

  server:
    build: .
    restart: always
    deploy:
      replicas: 3
    environment:
      HOTEL_MONGO_URI: mongodb://mongo:27017/hoteldb
    depends_on:
      - mongo
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hoteldb
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge