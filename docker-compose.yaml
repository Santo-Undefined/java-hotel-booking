services:
  nginx:
    image: nginx:latest
    container_name: nginxContainer
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
      - backend

  server:
    build: .
    restart: always
    deploy:
      replicas: 3
    environment:
      HOTEL_MONGO_URI: mongodb://mongo:27017/hoteldb
      JWT_SECURITY_KEY: 9a4f5c8d3b7a1e6f5q8d9a0b2c3d4e5f6a7b5c9d0e1fva3b4c5d6e7f8p9b0c3d
      JWT_EXP_TIME: 3600000
    depends_on:
      - mongo
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hoteldb
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge